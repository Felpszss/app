<script>
"use strict";

/* ---------- catalog (mirrors lib/drink-seed.ts) ---------- */
function group(category, icon, items) { return items.map(([name, abv]) => ({ category, icon, name, abv })); }
const DRINK_SEED = [
  ...group("Cervejas", "🍺", [["Heineken Original", 5], ["Stella Artois", 5], ["Corona Extra", 4.6], ["Budweiser", 5], ["Brahma Duplo Malte", 4.7], ["Skol Pilsen", 4.7]]),
  ...group("Whiskies", "🥃", [["Jack Daniel's Old No. 7", 40], ["Johnnie Walker Red Label", 40], ["Chivas Regal 12", 40], ["Ballantine's Finest", 40], ["Jameson Irish Whiskey", 40]]),
  ...group("Vodkas", "🍸", [["Absolut Original", 40], ["Smirnoff No. 21", 37.5], ["Grey Goose", 40], ["Cîroc", 40]]),
  ...group("Gins", "🍸", [["Tanqueray London Dry", 47.3], ["Bombay Sapphire", 47], ["Gordon's London Dry", 37.5], ["Beefeater London Dry", 40]]),
  ...group("Tequilas", "🌵", [["Patrón Silver", 40], ["1800 Blanco", 40], ["Don Julio Blanco", 40], ["José Cuervo Especial", 38]]),
  ...group("Runs", "🏴‍☠️", [["Bacardí Carta Blanca", 40], ["Havana Club 3 Años", 40], ["Captain Morgan Spiced", 35]]),
  { category: "Vinhos e espumantes", icon: "🍷", name: "Casillero del Diablo Cabernet", abv: 13.5 },
  { category: "Vinhos e espumantes", icon: "🍷", name: "Concha y Toro Reservado", abv: 12.5 },
  { category: "Vinhos e espumantes", icon: "🥂", name: "Chandon Réserve Brut", abv: 12 },
  { category: "Vinhos e espumantes", icon: "🥂", name: "Freixenet Cordon Negro", abv: 11.5 },
  { category: "Drinks clássicos", icon: "🍹", name: "Caipirinha", abv: 20, note: "estimado" },
  { category: "Drinks clássicos", icon: "🍸", name: "Moscow Mule", abv: 13, note: "estimado" },
  { category: "Drinks clássicos", icon: "🍹", name: "Aperol Spritz", abv: 9, note: "estimado" },
  { category: "Drinks clássicos", icon: "🍸", name: "Gin tônica", abv: 11, note: "estimado" },
  { category: "Drinks clássicos", icon: "🥃", name: "Negroni", abv: 24, note: "estimado" },
];
DRINK_SEED.forEach((d, i) => (d.id = i + 1));

/* ---------- scoring rules (mirrors lib/scoring.ts) ---------- */
const UNIT_TO_ML = { ml: 1, L: 1000, lata: 350, "long neck": 330, garrafa: 600, dose: 45, "taça": 150, copo: 300 };
const ETHANOL_DENSITY_G_PER_ML = 0.789;
const MAX_SINGLE_AMOUNT_ML = 4000;
const MIN_CHECKIN_INTERVAL_MINUTES = 10;
const DAILY_POINT_CAP = 120;
const WEEKLY_RISK_THRESHOLD_G = 140;
const MAX_EVENT_DURATION_DAYS = 30;

function unitToMl(amountRaw, unitLabel) {
  const factor = UNIT_TO_ML[unitLabel];
  if (!factor) throw new Error(`Unidade desconhecida: ${unitLabel}`);
  if (!Number.isFinite(amountRaw) || amountRaw <= 0) throw new Error("Quantidade inválida.");
  const ml = Math.round(amountRaw * factor);
  if (ml > MAX_SINGLE_AMOUNT_ML) throw new Error(`Quantidade acima do limite permitido por check-in (${MAX_SINGLE_AMOUNT_ML} ml).`);
  return ml;
}
function gramsOfAlcohol(ml, abv) { return ml * (abv / 100) * ETHANOL_DENSITY_G_PER_ML; }
function pointsForGrams(g) { return Math.max(1, Math.round(g)); }
function capDailyPoints(total) { return Math.min(total, DAILY_POINT_CAP); }
function eventStatus(ev) {
  const now = Date.now();
  if (now < ev.startsAt.getTime()) return "upcoming";
  if (now > ev.endsAt.getTime()) return "ended";
  return "active";
}
const EVENT_STATUS_LABEL = { upcoming: "Em breve", active: "Rolando agora", ended: "Encerrado" };

/* ---------- state ---------- */
const state = {
  screen: "feed",
  user: { id: 1, displayName: "Você", email: "voce@exemplo.com", initials: "V" },
  communities: [],
  activeCommunityId: null,
  checkins: [],
  events: [],
  nextCommunityId: 1,
  nextCheckinId: 1,
  nextEventId: 1,
  period: "Semana",
  selectedEventId: null,
  form: { photoPreview: null, drinkId: null, amount: "350", unit: "ml", title: "", description: "" },
  formError: null,
  published: false,
  notice: null,
};

function activeCommunity() { return state.communities.find((c) => c.id === state.activeCommunityId) || null; }
function avatarInitials(name) {
  const letters = name.trim().split(/\s+/).map((p) => (p.match(/\p{L}/u)?.[0]?.toUpperCase() ?? "")).filter(Boolean);
  return letters.slice(0, 2).join("") || "?";
}
function genInviteCode() {
  const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for (let i = 0; i < 6; i++) code += alphabet[Math.floor(Math.random() * alphabet.length)];
  return code;
}
function fmtDay(date) { return new Intl.DateTimeFormat("pt-BR", { weekday: "long", day: "numeric", month: "short" }).format(date); }
function fmtTime(date) { return new Intl.DateTimeFormat("pt-BR", { hour: "2-digit", minute: "2-digit" }).format(date); }
function fmtEvent(date) { return new Intl.DateTimeFormat("pt-BR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }).format(date); }
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

/* ---------- domain logic (mirrors the API routes) ---------- */
function computeRanking(communityId, period) {
  const sinceDays = { "Semana": 7, "Mês": 30, "Ano": 365, "Todas": null }[period];
  const cutoff = sinceDays ? Date.now() - sinceDays * 86400000 : null;
  const relevant = state.checkins.filter((c) => c.communityId === communityId && !c.flagged && (!cutoff || c.createdAt.getTime() >= cutoff));
  const byUserDay = new Map();
  for (const c of relevant) {
    const key = c.userId + "|" + c.createdAt.toISOString().slice(0, 10);
    byUserDay.set(key, (byUserDay.get(key) || 0) + c.points);
  }
  const totals = new Map();
  const byDay = new Map();
  for (const [key, raw] of byUserDay) {
    const [userId, day] = key.split("|");
    const uid = Number(userId);
    const capped = capDailyPoints(raw);
    const t = totals.get(uid) || { points: 0, wins: 0 };
    t.points += capped;
    totals.set(uid, t);
    const list = byDay.get(day) || [];
    list.push({ userId: uid, points: capped });
    byDay.set(day, list);
  }
  for (const list of byDay.values()) {
    const best = list.reduce((a, b) => (b.points > a.points ? b : a));
    const t = totals.get(best.userId);
    if (t) t.wins += 1;
  }
  const ranking = [...totals.entries()]
    .map(([userId, v]) => ({ userId, name: state.user.displayName, initials: state.user.initials, points: v.points, wins: v.wins }))
    .sort((a, b) => b.points - a.points);
  const topWinners = [...ranking].sort((a, b) => b.wins - a.wins).filter((r) => r.wins > 0);
  return { ranking, topWinners };
}
function computeEventRanking(ev) {
  const relevant = state.checkins.filter(
    (c) => c.communityId === ev.communityId && !c.flagged && c.createdAt >= ev.startsAt && c.createdAt <= ev.endsAt
  );
  const byUserDay = new Map();
  for (const c of relevant) {
    const key = c.userId + "|" + c.createdAt.toISOString().slice(0, 10);
    byUserDay.set(key, (byUserDay.get(key) || 0) + c.points);
  }
  const totals = new Map();
  for (const [key, raw] of byUserDay) {
    const uid = Number(key.split("|")[0]);
    const t = totals.get(uid) || { points: 0 };
    t.points += capDailyPoints(raw);
    totals.set(uid, t);
  }
  return [...totals.entries()]
    .map(([userId, v]) => ({ userId, name: state.user.displayName, initials: state.user.initials, points: v.points }))
    .sort((a, b) => b.points - a.points);
}

/* ---------- modals (the sandboxed artifact viewer blocks window.prompt/alert/confirm,
   so every native dialog in the original app is replaced with this in-page equivalent) ---------- */
function closeModal() { document.getElementById("modal-root").innerHTML = ""; }
function promptModal(title, fields) {
  return new Promise((resolve) => {
    const root = document.getElementById("modal-root");
    root.innerHTML = `<div class="modal-backdrop"><div class="modal-box">
      <h3>${esc(title)}</h3>
      ${fields.map((f) => `<label class="modal-field"><span>${esc(f.label)}</span><input id="${f.id}" type="${f.type || "text"}" value="${esc(f.value ?? "")}" placeholder="${esc(f.placeholder ?? "")}" /></label>`).join("")}
      <div class="modal-actions"><button class="modal-cancel" type="button">Cancelar</button><button class="modal-ok" type="button">OK</button></div>
    </div></div>`;
    const finish = (result) => { closeModal(); resolve(result); };
    root.querySelector(".modal-cancel").addEventListener("click", () => finish(null));
    root.querySelector(".modal-ok").addEventListener("click", () => {
      const values = {};
      for (const f of fields) values[f.id] = document.getElementById(f.id).value;
      finish(values);
    });
    root.querySelectorAll(".modal-field input").forEach((input) => {
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") root.querySelector(".modal-ok").click(); });
    });
    document.getElementById(fields[0].id)?.focus();
  });
}
function confirmModal(message, confirmLabel) {
  return new Promise((resolve) => {
    const root = document.getElementById("modal-root");
    root.innerHTML = `<div class="modal-backdrop"><div class="modal-box">
      <p>${esc(message)}</p>
      <div class="modal-actions"><button class="modal-cancel" type="button">Cancelar</button><button class="modal-ok" type="button">${esc(confirmLabel || "Confirmar")}</button></div>
    </div></div>`;
    root.querySelector(".modal-cancel").addEventListener("click", () => { closeModal(); resolve(false); });
    root.querySelector(".modal-ok").addEventListener("click", () => { closeModal(); resolve(true); });
  });
}
function alertModal(message) {
  return new Promise((resolve) => {
    const root = document.getElementById("modal-root");
    root.innerHTML = `<div class="modal-backdrop"><div class="modal-box"><p>${esc(message)}</p><div class="modal-actions"><button class="modal-ok" type="button">OK</button></div></div></div>`;
    root.querySelector(".modal-ok").addEventListener("click", () => { closeModal(); resolve(); });
  });
}

function publishCheckin() {
  const title = state.form.title.trim();
  const description = state.form.description.trim();

  if (!state.form.photoPreview) { state.formError = "Foto obrigatória."; render(); return; }
  if (!title) { state.formError = "Título é obrigatório."; render(); return; }
  if (!state.form.drinkId) { state.formError = "Selecione uma bebida."; render(); return; }

  const drink = DRINK_SEED.find((d) => d.id === state.form.drinkId);
  let amountMl;
  try { amountMl = unitToMl(Number(state.form.amount), state.form.unit); }
  catch (e) { state.formError = e.message; render(); return; }

  const last = state.checkins.filter((c) => c.userId === state.user.id).sort((a, b) => b.createdAt - a.createdAt)[0];
  if (last) {
    const minutesSince = (Date.now() - last.createdAt.getTime()) / 60000;
    if (minutesSince < MIN_CHECKIN_INTERVAL_MINUTES) {
      state.formError = `Aguarde ${Math.ceil(MIN_CHECKIN_INTERVAL_MINUTES - minutesSince)} min antes do próximo check-in (mesma regra anti-spam do app real).`;
      render();
      return;
    }
  }

  const grams = gramsOfAlcohol(amountMl, drink.abv);
  const points = pointsForGrams(grams);
  const checkin = {
    id: state.nextCheckinId++, communityId: state.activeCommunityId, userId: state.user.id, drinkId: drink.id,
    title, description: description || null, amountRaw: Number(state.form.amount), unitLabel: state.form.unit,
    amountMl, points, createdAt: new Date(), flagged: false,
  };
  state.checkins.unshift(checkin);

  const weekAgo = Date.now() - 7 * 86400000;
  const weeklyPoints = state.checkins.filter((c) => c.userId === state.user.id && c.createdAt.getTime() >= weekAgo).reduce((s, c) => s + c.points, 0);
  state.notice = weeklyPoints > WEEKLY_RISK_THRESHOLD_G
    ? "Beba com responsabilidade. Se o consumo estiver te preocupando, procure apoio: CVV 188 (24h, gratuito). Seu consumo somado dos últimos 7 dias está alto — considere dar um tempo."
    : null;
  state.published = true;
  state.formError = null;
  render();
  setTimeout(() => {
    state.published = false;
    state.form = { photoPreview: null, drinkId: null, amount: "350", unit: "ml", title: "", description: "" };
    setScreen("feed");
  }, 1200);
}

async function promptEventFields(title, defaults) {
  const result = await promptModal(title, [
    { id: "e-name", label: "Nome do evento", placeholder: "Ex.: Sextou Cup", value: defaults.name },
    { id: "e-prize", label: "Prêmio para o topo do ranking (opcional)", placeholder: "Ex.: Chopp grátis", value: defaults.prize },
    { id: "e-start", label: "Em quantos dias começa?", type: "number", value: defaults.daysUntilStart },
    { id: "e-duration", label: "Quantos dias vai durar?", type: "number", value: defaults.durationDays },
  ]);
  if (!result) return null;
  const name = result["e-name"].trim();
  if (!name) { await alertModal("Nome do evento é obrigatório."); return null; }
  const daysUntilStart = Number(result["e-start"]);
  const durationDays = Number(result["e-duration"]);
  if (!Number.isFinite(daysUntilStart) || daysUntilStart < 0 || !Number.isFinite(durationDays) || durationDays <= 0) {
    await alertModal("Dias inválidos.");
    return null;
  }
  if (durationDays > MAX_EVENT_DURATION_DAYS) {
    await alertModal(`Eventos podem durar no máximo ${MAX_EVENT_DURATION_DAYS} dias.`);
    return null;
  }
  const startsAt = new Date(Date.now() + daysUntilStart * 86400000);
  const endsAt = new Date(startsAt.getTime() + durationDays * 86400000);
  return { name, prize: result["e-prize"].trim(), startsAt, endsAt };
}
async function createEvent() {
  if (!state.activeCommunityId) return;
  const fields = await promptEventFields("Novo evento", { name: "", prize: "", daysUntilStart: "0", durationDays: "1" });
  if (!fields) return;
  state.events.push({ id: state.nextEventId++, communityId: state.activeCommunityId, name: fields.name, prize: fields.prize || null, startsAt: fields.startsAt, endsAt: fields.endsAt });
  render();
}
async function editEvent() {
  const ev = state.events.find((e) => e.id === state.selectedEventId);
  if (!ev) return;
  const fields = await promptEventFields("Editar evento", {
    name: ev.name, prize: ev.prize || "",
    daysUntilStart: Math.max(0, Math.round((ev.startsAt.getTime() - Date.now()) / 86400000)).toString(),
    durationDays: Math.max(1, Math.round((ev.endsAt.getTime() - ev.startsAt.getTime()) / 86400000)).toString(),
  });
  if (!fields) return;
  ev.name = fields.name; ev.prize = fields.prize || null; ev.startsAt = fields.startsAt; ev.endsAt = fields.endsAt;
  render();
}
async function cancelEvent() {
  const ev = state.events.find((e) => e.id === state.selectedEventId);
  if (!ev) return;
  const ok = await confirmModal(`Cancelar o evento "${ev.name}"? Essa ação não pode ser desfeita.`, "Cancelar evento");
  if (!ok) return;
  state.events = state.events.filter((e) => e.id !== ev.id);
  state.selectedEventId = null;
  setScreen("events");
}

    <header class="group-header"><button class="avatar-button" data-action="nav" data-screen="profile">${Avatar(state.user.initials)}</button>
      <div class="header-actions"><button data-action="nav" data-screen="communities">♧</button><button>•••</button></div>
    </header>
    <h1 class="group-name">${(activeCommunity()?.name ?? "BeerRats").toUpperCase()}</h1>
    <section class="chat-empty">
      <span>💬</span><h2>Bate-papo do grupo</h2><p>Combine o próximo encontro com a galera.</p>
      <div><input placeholder="Escrever mensagem..." /><button>↑</button></div>
    </section>
    ${BottomNav("chat")}
  </div>`;
}

function screenFeedOrRanking() {
  const community = activeCommunity();
  const { ranking, topWinners } = community ? computeRanking(community.id, state.period) : { ranking: [], topWinners: [] };
  const leader = ranking[0];
  const events = community ? state.events.filter((e) => e.communityId === community.id) : [];
  const highlighted = events.find((ev) => {
    const s = eventStatus(ev);
    if (s === "active") return true;
    if (s === "upcoming") return ev.startsAt.getTime() - Date.now() <= 24 * 60 * 60 * 1000;
    return false;
  });

  let body = "";
  if (state.screen === "feed") {
    if (!community) {
      body = `<section class="community-hero"><div><span>🍻</span><h2>Entre em uma comunidade</h2><p>Crie ou entre em uma comunidade para começar a registrar e comparar check-ins.</p></div><button data-action="nav" data-screen="communities">Ver comunidades</button></section>`;
    } else {
      const feed = state.checkins.filter((c) => c.communityId === community.id && !c.flagged);
      const dayMap = new Map();
      for (const item of feed) { const key = item.createdAt.toISOString().slice(0, 10); const l = dayMap.get(key) || []; l.push(item); dayMap.set(key, l); }
      const days = [...dayMap.entries()].map(([, list]) => [fmtDay(list[0].createdAt), list]);
      body = `
        <section class="hero-card">
          <div class="hero-photo"><span>🍻</span></div>
          <div class="score-duel">
            <div>${Avatar(leader?.initials ?? "–")}<span><b>${leader?.points ?? 0}</b><small>${leader?.userId === state.user.id ? "Você" : "Líder"}</small></span></div>
            <div>${Avatar(state.user.initials)}<span><b>${ranking.find((r) => r.userId === state.user.id)?.points ?? 0}</b><small>Você</small></span></div>
          </div>
        </section>
        <div class="timeline">
          ${days.length === 0 ? `<p class="tiny-warning" style="padding:24px 0">Nenhum check-in ainda. Toque no + para registrar o primeiro.</p>` :
            days.map(([label, items]) => `<div class="day-block"><p>${label}</p>${items.map((it) => {
              const drink = DRINK_SEED.find((d) => d.id === it.drinkId);
              return `<article><div class="feed-thumb">${drink?.icon ?? "🍺"}</div><div><h3>${esc(it.title)}</h3><span>${Avatar(state.user.initials)}${esc(state.user.displayName)} · ${it.points} pts</span></div><time>${fmtTime(it.createdAt)}</time></article>`;
            }).join("")}</div>`).join("")}
        </div>
        <button class="floating" aria-label="Novo check-in" data-action="nav" data-screen="checkin">＋</button>`;
    }
  } else {
    body = `<section class="ranking-screen">
      <p class="date-range">Classificação da comunidade</p>
      <div class="period-tabs">${["Semana", "Mês", "Ano", "Todas"].map((p) => `<button class="${state.period === p ? "active" : ""}" data-action="set-period" data-period="${p}">${p}</button>`).join("")}</div>
      <p class="list-title">Classificações</p>
      <div class="rank-card">${ranking.length === 0 ? `<p class="tiny-warning" style="padding:16px 0">Nenhum check-in nesse período ainda.</p>` :
        ranking.map((p, i) => `<div class="person">${Avatar(p.initials)}<span><b>${esc(p.name)}${p.userId === state.user.id ? " (você)" : ""}</b><small>${p.points} pontos</small></span><em>${i + 1}º</em></div>`).join("")}</div>
      <p class="list-title">Vitórias</p>
      <div class="rank-card">${topWinners.length === 0 ? `<p class="tiny-warning" style="padding:16px 0">Sem vitórias registradas ainda.</p>` :
        topWinners.map((p, i) => `<div class="person">${Avatar(p.initials)}<span><b>${esc(p.name)}</b><small>${p.wins} vitória${p.wins === 1 ? "" : "s"} diária${p.wins === 1 ? "" : "s"}</small></span><em>${i + 1}º</em></div>`).join("")}</div>
    </section>
    <button class="floating" aria-label="Novo check-in" data-action="nav" data-screen="checkin">＋</button>`;
  }

  return `<div class="phone">
    <header class="group-header">
      <button class="avatar-button" data-action="nav" data-screen="profile">${Avatar(state.user.initials)}</button>
      <div class="header-actions"><button data-action="nav" data-screen="communities">♧${events.length ? "<i></i>" : ""}</button><button>•••</button></div>
    </header>
    <h1 class="group-name">${esc((community?.name ?? "BeerRats").toUpperCase())}</h1>
    ${state.notice ? `<p class="tiny-warning">${esc(state.notice)}</p>` : ""}
    ${state.screen === "feed" && highlighted ? `<button class="event-banner" data-action="open-event" data-id="${highlighted.id}">🏆 ${eventStatus(highlighted) === "active" ? "Rolando agora: " : "Começa em breve: "}<b>${esc(highlighted.name)}</b>${highlighted.prize ? ` · 🎁 ${esc(highlighted.prize)}` : ""}</button>` : ""}
    ${body}
    ${BottomNav(state.screen)}
  </div>`;
}

/* ---------- router + delegated events ---------- */
function render() {
  const app = document.getElementById("app");
  switch (state.screen) {
    case "checkin": app.innerHTML = screenCheckin(); break;
    case "drinks": app.innerHTML = screenDrinks(); break;
    case "quantity": app.innerHTML = screenQuantity(); break;
    case "communities": app.innerHTML = screenCommunities(); break;
    case "events": app.innerHTML = screenEvents(); break;
    case "event": app.innerHTML = screenEvent(); break;
    case "profile": app.innerHTML = screenProfile(); break;
    case "settings": app.innerHTML = screenSettings(); break;
    case "chat": app.innerHTML = screenChat(); break;
    default: app.innerHTML = screenFeedOrRanking();
  }
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  if (action === "nav") setScreen(el.dataset.screen);
  else if (action === "select-community") { state.activeCommunityId = Number(el.dataset.id); setScreen("feed"); }
  else if (action === "create-community") createCommunity();
  else if (action === "join-community") joinCommunity();
  else if (action === "pick-drink") pickDrink(Number(el.dataset.id));
  else if (action === "pick-unit") pickUnit(el.dataset.unit);
  else if (action === "publish-checkin") publishCheckin();
  else if (action === "set-period") { state.period = el.dataset.period; render(); }
  else if (action === "open-events") setScreen("events");
  else if (action === "create-event") createEvent();
  else if (action === "open-event") { state.selectedEventId = Number(el.dataset.id); setScreen("event"); }
  else if (action === "edit-event") editEvent();
  else if (action === "cancel-event") cancelEvent();
  else if (action === "alert-demo") alertModal("Isso é uma demo local — sair/entrar de verdade acontece pelo login do ChatGPT no app publicado.");
});
window.onPhoto = onPhoto;
window.state = state;

render();
</script>
